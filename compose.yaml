# Without this, Compose names everything after the directory the checkout
# happens to sit in — globetrek-app-laravel.test-1, or worse if it was renamed.
name: globetrek

services:
    laravel.test:
        container_name: globetrek
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'globetrek/sail-8.4'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            # No Vite port: the site's CSS/JS are committed under public/assets
            # and nothing routed uses @vite, so publishing 5173 would only
            # collide with another Sail project on the same machine.
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on: {}
networks:
    sail:
        driver: bridge

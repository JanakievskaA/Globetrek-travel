# A distinct name from the Sail stack (`globetrek`), so the two can coexist on
# one machine and an accidental `up` of both fails on the port rather than on a
# container-name clash.
name: globetrek-standalone

services:
  app:
    build: .
    image: globetrek/standalone
    container_name: globetrek-standalone
    ports:
      # host:container — 8123 on the host keeps it clear of the 8000 the
      # original static template used. Change the left number if it is taken.
      - "8123:8000"
    environment:
      APP_URL: http://localhost:8123
    volumes:
      # The SQLite database, the generated app key and uploaded images all live
      # here, so `docker compose down` and `up` again keeps your data.
      # `docker compose down -v` is the deliberate reset.
      - globetrek-storage:/app/storage
    restart: unless-stopped

volumes:
  globetrek-storage:

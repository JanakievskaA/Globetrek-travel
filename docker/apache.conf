# The port here is a placeholder. Render picks the port at runtime and hands it
# over as $PORT, so docker/entrypoint.sh rewrites this line and ports.conf
# before Apache starts.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # public/.htaccess owns the front-controller rewrite, so it has to be
        # allowed to apply.
        AllowOverride All
        Require all granted

        # public/storage is a symlink into storage/app/public — without this,
        # every uploaded image 403s.
        Options -Indexes +FollowSymLinks
    </Directory>

    # Render collects logs from the container's stdout/stderr; writing to files
    # inside an instance that gets wiped would put them where nobody reads them.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

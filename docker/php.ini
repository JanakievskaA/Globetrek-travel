; Production PHP settings. The official image ships no php.ini at all, so this
; file is the whole configuration.

memory_limit = 256M

; The media picker accepts images up to 8 MB (see MediaController), so both of
; these have to clear that with room for the rest of the multipart body.
upload_max_filesize = 10M
post_max_size = 12M

expose_php = Off

; Errors belong in the log stream, never in a response body.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; The code cannot change without a new image, so stat'ing every file on every
; request buys nothing.
opcache.validate_timestamps = 0
